<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#286b5b">
  <title>You're offline · LearnOrbit</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; background: #f5f3e9; color: #20372e; font: 500 16px/1.6 system-ui, sans-serif; }
    main { width: min(100%, 520px); padding: 32px; border: 2px solid #20372e; border-radius: 24px 24px 24px 8px; background: #fffdf6; box-shadow: 6px 7px 0 #20372e; }
    h1 { margin: 0 0 8px; font-size: 1.8rem; }
    p { margin: 0 0 20px; color: #52645a; }
    button { min-height: 44px; padding: 10px 16px; border: 2px solid #20372e; border-radius: 12px; background: #286b5b; color: #fff; font: inherit; font-weight: 750; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>Reconnect to continue using LearnOrbit. Your account pages and learning data will load when your connection returns.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
