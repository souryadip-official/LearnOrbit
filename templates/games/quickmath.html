{% extends "base.html" %}{% block title %}Quick Math{% endblock %}{% block topbar_title %}<i data-lucide="sigma"></i> Quick Math{% endblock %}{% block content %}<section class="feature-page"><div class="feature-card"><h1>Quick Math</h1><p>Answer as many as you can in 60 seconds.</p><div class="clock-display" id="equation">Press Start</div><div class="feature-form-grid"><input class="form-input" id="answer" type="number" inputmode="numeric" placeholder="Your answer"><button class="btn-primary" id="check" disabled>Submit</button></div><p>Score: <strong id="score">0</strong> · Time: <strong id="time">60</strong>s</p><button class="btn-primary" id="start">Start round</button></div></section>{% endblock %}{% block scripts %}<script>
let a,b,score=0,time=60,tick;function question(){a=Math.floor(Math.random()*20)+2;b=Math.floor(Math.random()*20)+2;document.getElementById('equation').textContent=`${a} × ${b} = ?`;document.getElementById('answer').value='';document.getElementById('answer').focus()}document.getElementById('start').onclick=()=>{clearInterval(tick);score=0;time=60;document.getElementById('score').textContent=score;document.getElementById('time').textContent=time;document.getElementById('check').disabled=false;question();tick=setInterval(()=>{time--;document.getElementById('time').textContent=time;if(time<=0){clearInterval(tick);document.getElementById('check').disabled=true;document.getElementById('equation').textContent='Round complete';window.saveGameScore?.('quickmath',score);showToast(`You scored ${score}.`,'success')}},1000)};document.getElementById('check').onclick=()=>{if(Number(document.getElementById('answer').value)===a*b){score++;document.getElementById('score').textContent=score}question()};document.getElementById('answer').onkeydown=e=>{if(e.key==='Enter'&&!document.getElementById('check').disabled)document.getElementById('check').click()};
</script>{% endblock %}
